- name: Basic requirements
  hosts: legacy-of-lunatic-kingdom
  become: true
  tasks:

    - name: Install basic packages
      ansible.builtin.apt:
        pkg:
          - git
          - net-tools # ifconfig
          - neovim
          - prometheus-node-exporter
          - prometheus-node-exporter-collectors # apt_info + reboot-required metrics
          - python3-lxml # ansible bcrypt
          - rsync
        state: present
        update_cache: true

    - name: Configure node-exporter collectors
      vars:
        # The systemd + apt collectors expose unattended-upgrades health to the
        # node-exporter target (last run, pending security updates, reboot
        # needed). See playbooks/unattended-upgrades.yml.
        node_exporter_args:
          - --collector.textfile.directory=/var/lib/prometheus/node-exporter
          - --collector.systemd
          - --collector.systemd.unit-include=apt-daily.*\.(timer|service)
          - >-
            --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|media|var/lib/containers/storage/.+)($|/)
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-node-exporter
        regexp: '^ARGS='
        line: 'ARGS="{{ node_exporter_args | join(" ") }}"'
        create: true
        mode: '0644'
      notify: Restart node exporter

    # Periodically regenerates apt.prom (pending upgrades, reboot-required) in
    # the textfile directory above.
    - name: Enable node-exporter apt collector
      ansible.builtin.systemd:
        name: prometheus-node-exporter-apt.timer
        enabled: true
        state: started

  handlers:
    - name: Restart node exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: restarted

# TODO Standardize these into a shared playbook
- name: Secure the system
  hosts: legacy-of-lunatic-kingdom
  become: true
  tasks:

    - name: Disable SSH password logins
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^(#\s*)?{{ item }} '
        line: "{{ item }} no"
      with_items:
        - ChallengeResponseAuthentication
        - PasswordAuthentication
        - UsePAM
      notify: Restart sshd

    - name: Allow sudo without password
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: '^%sudo'
        line: '%sudo ALL=(ALL:ALL) NOPASSWD:ALL'
        validate: 'visudo -cf %s'

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted

