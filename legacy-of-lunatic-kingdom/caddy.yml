# https://caddyserver.com/
- name: Set up Caddy
  tags: caddy
  hosts: legacy-of-lunatic-kingdom
  become: true
  vars:
    version: "{{ versions.caddy }}"
  tasks:

    - name: Assert distribution is Debian
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Debian"
        fail_msg: "This playbook only supports Debian distributions"

    - name: Make Caddy data directory
      ansible.builtin.file:
        path: "{{ (data_dir, 'caddy/data') | path_join }}"
        state: directory
        mode: "0755"

    - name: Set up Caddyfile
      ansible.builtin.template:
        src: templates/Caddyfile
        dest: "{{ (data_dir, 'caddy/Caddyfile') | path_join }}"
        mode: "0644"
      notify: Restart caddy

    - name: Create Tailscale auth key secret
      containers.podman.podman_secret:
        name: caddy_tsauthkey
        data: "{{ tailscale.auth_key }}"
        state: present
      no_log: true
      notify: Restart caddy

    - name: Set up podman network unit
      ansible.builtin.copy:
        content: |
          [Network]
          NetworkName=legacy_of_lunatic_kingdom
        dest: /etc/containers/systemd/legacy_of_lunatic_kingdom.network
        mode: "0644"
      notify: Restart caddy

    - name: Set up Caddy container unit
      ansible.builtin.template:
        src: templates/caddy.container
        dest: /etc/containers/systemd/caddy.container
        mode: "0644"
      notify: Restart caddy

    - name: Enable and start Caddy
      ansible.builtin.systemd:
        name: caddy.service
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart caddy
      ansible.builtin.systemd:
        name: caddy.service
        state: restarted
        daemon_reload: true

