- name: Caddy
  tags: caddy
  hosts: mountain-of-faith
  become: true
  vars_files:
    - vars.private
  vars:
    # don't forget to update docker-caddy-tailscale first!
    version: 2.10.0
  tasks:

    - name: Make /mnt/mountain-of-faith/caddy
      ansible.builtin.file:
        path: /mnt/mountain-of-faith/{{ item }}
        state: directory
        mode: "0755"
      loop:
        - caddy
        - caddy/config
        - caddy/data

    # TODO Reload Caddy when this changes:
    #      docker exec -w /etc/caddy $caddy_container_id caddy reload
    - name: Set up Caddyfile
      ansible.builtin.template:
        src: templates/Caddyfile
        dest: /mnt/mountain-of-faith/caddy/Caddyfile
        mode: "0644"

    - name: Run Caddy
      community.docker.docker_container:
        name: caddy
        image: ghcr.io/kejadlen/caddy-tailscale:{{ version }}
        restart: true
        env:
          TS_AUTHKEY: "{{ tailscale.auth_key }}"
        ports:
          - "80:80"
          - "443:443"
          - "443:443/udp"
          - "2019:2019"
        volumes:
          - /mnt/mountain-of-faith/caddy/Caddyfile:/etc/caddy/Caddyfile
          - /mnt/mountain-of-faith/caddy/data:/data
          - /mnt/mountain-of-faith/caddy/config:/config
        restart_policy: unless-stopped
        networks:
          - name: mountain-of-faith
        etc_hosts:
          host.docker.internal: host-gateway

