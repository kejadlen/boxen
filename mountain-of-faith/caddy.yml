# https://caddyserver.com/docs/install#debian-ubuntu-raspbian

- name: Run Caddy
  tags: caddy
  hosts: mountain-of-faith
  become: true
  tasks:

    # sudo apt install -y debian-keyring debian-archive-keyring apt-transport-https curl
    - name: Install prerequisites
      ansible.builtin.apt:
        pkg:
          - apt-transport-https
          - curl
          - debian-archive-keyring
          - debian-keyring
        state: present
        update_cache: true

    # curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    # chmod o+r /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    - name: Add Caddy GPG key
      ansible.builtin.apt_key:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        keyring: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        state: present

    - name: Set permissions on Caddy keyring
      ansible.builtin.file:
        path: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        mode: '0644'

    # curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
    # chmod o+r /etc/apt/sources.list.d/caddy-stable.list
    - name: Add Caddy repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
        filename: caddy-stable
        state: present

    # sudo apt update
    # sudo apt install caddy
    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: true

    - name: Configure Caddy
      ansible.builtin.copy:
        content: |
          # Since I don't want to run Tailscale on the BirdNET-Pi, this uses
          # mountain-of-faith as a passthrough since they're on the same
          # network.
          :8081 {
            # It would be nice for this to be hopeless-masquerade.local, but
            # Caddy can't resolve mDNS (see below issue). The workaround in the
            # issue of using systemd-resolved also doesn't work since then we
            # have contention over /etc/resolv.conf between systemd-resolved
            # and Tailscale. So we use just the raw IP for now.
            #
            # https://github.com/caddyserver/caddy/issues/5372
            reverse_proxy 192.168.2.161
          }
        dest: /etc/caddy/Caddyfile
        mode: "0644"
      notify: Restart Caddy

  handlers:
    - name: Restart Caddy
      ansible.builtin.systemd:
        name: caddy
        state: restarted
        enabled: true

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
        enabled: true


