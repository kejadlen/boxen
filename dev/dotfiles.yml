- hosts: all
  tasks:

  - name: List dotfiles
    shell: ls -A ~/.dotfiles | grep '^\.'
    register: ls_dotfiles

  - name: Symlink dotfiles
    file:
      src: ~/.dotfiles/{{ item }}
      dest: ~/{{ item }}
      state: link
    loop:  "{{ ls_dotfiles.stdout_lines | difference(['.git', '.gitmodules']) }}"

  - name: Symlink Prezto runcoms
    file:
      src: "{{ item }}"
      dest: ~/.{{ item | basename }}
      state: link
    with_fileglob: "~/.zprezto/runcoms/z*"
