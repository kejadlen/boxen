- hosts: all
  tasks:

  - group_by: key=os_{{ ansible_distribution }}
    tags: always

  - ansible.builtin.git:
      repo: git@git.kejadlen.dev:alpha/dotfiles.git
      dest: ~/.dotfiles.git
      bare: true

  # macOS things

