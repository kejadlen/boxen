# https://setup.vector.dev

- name: Install Vector on Debian
  tags: vector
  hosts: hopeless-masquerade
  become: true
  tasks:

    - name: Install required dependencies
      ansible.builtin.apt:
        pkg:
          - apt-transport-https
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Download Vector GPG key
      ansible.builtin.get_url:
        url: https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public
        dest: /tmp/vector_key.public
        mode: '0644'

    - name: Import Vector GPG key
      ansible.builtin.command: gpg --dearmor --output /usr/share/keyrings/datadog-archive-keyring.gpg /tmp/vector_key.public
      args:
        creates: /usr/share/keyrings/datadog-archive-keyring.gpg

    - name: Add Vector repository
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/usr/share/keyrings/datadog-archive-keyring.gpg] https://apt.vector.dev/ stable vector-0
        filename: vector
        state: present
        update_cache: true

    - name: Install Vector
      ansible.builtin.apt:
        name: vector
        state: present
        update_cache: true

    - name: Enable and start Vector service
      ansible.builtin.systemd:
        name: vector
        enabled: true
        state: started
        daemon_reload: true

    - name: Clean up temporary key file
      ansible.builtin.file:
        path: /tmp/vector_key.public
        state: absent

