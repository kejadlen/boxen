- name: Install homebrew formulae
  hosts: macos
  tasks:

    - name: Tap some Homebrews
      community.general.homebrew_tap:
        name: "{{ taps | join(',') }}"
      vars:
        taps:
          - felixkratz/formulae
          - nikitabobko/tap

    - name: Install fonts
      community.general.homebrew:
        name: "{{ fonts | join(',') }}"
      vars:
        fonts:
          - font-sauce-code-pro-nerd-font
          - font-source-code-pro
          - font-symbols-only-nerd-font

    - name: Install Homebrew things
      community.general.homebrew:
        name: "{{ formulae | join(',') }}"
      vars:
        formulae:
          - 1password-cli
          - chruby
          - difftastic
          - direnv
          - docker
          - docker-compose
          - efm-langserver
          - entr
          - eza
          - fd
          - fzf
          - ghostty
          - git
          - git-lfs
          - jj
          - jq
          - luarocks
          - pam-reattach
          - restic
          - ripgrep
          - ruby-install
          - shellcheck
          - tmux
          - yaml-language-server
          - zoxide
          - zsh

    - name: Install casks
      community.general.homebrew_cask:
        name: "{{ casks | join(',') }}"
      vars:
        casks:
          - 1password
          - aerospace
          - alfred
          - arc
          - fantastical
          - firefox@developer-edition
          - hammerspoon
          - mailmate
          - obsidian
          - orbstack
          - slack
          - tailscale
          - zoom

    # these doesn't work w/the ansible module for some reason

    - name: Install sketchybar
      command: brew install sketchybar
      args:
        creates: /opt/homebrew/bin/sketchybar
      notify: Restart sketchybar

    # handle caveats

    - name: Create Docker CLI plugins config dir
      ansible.builtin.file:
        dest: ~/.docker/cli-plugins
        state: directory

  handlers:

    - name: Restart sketchybar
      command: brew services restart sketchybar

