- name: Do macOS things
  hosts: macos
  tasks:
    - name: Homebrew bundle
      ansible.builtin.command: brew bundle --file ~/src/boxen/local/Brewfile

- import_playbook: defaults.yml

- name: Other macOS-specific things
  hosts: macos
  tasks:
    - name: Jujutsu things
      block:
        - name: Register Jujutsu config location
          ansible.builtin.command: jj config path --user
          register: jj_config_path_user
          changed_when: false

        - name: Make sure Jujutsu config dir exists
          ansible.builtin.file:
            dest: "{{ path | dirname }}"
            state: directory
          vars:
            path: "{{ jj_config_path_user.stdout }}"

        - name: Symlink Jujutsu config
          ansible.builtin.file:
            src: ~/.config/jj/config.toml
            dest: "{{ dest }}"
            state: link
          vars:
            dest: "{{ jj_config_path_user.stdout }}"
