- tags: brew
  hosts: macos
  tasks:
    - name: Homebrew bundle
      ansible.builtin.command: brew bundle --file=~/src/boxen/local/Brewfile

- tags: jujutsu
  hosts: macos
  tasks:
    - name: Register Jujutsu config location
      ansible.builtin.command: jj config path --user
      register: jj_config_path_user
      changed_when: false

    - name: Make sure Jujutsu config dir exists
      ansible.builtin.file:
        dest: "{{ path | dirname }}"
        state: directory
        mode: "0700"
      vars:
        path: "{{ jj_config_path_user.stdout }}"

    - name: Symlink Jujutsu config
      ansible.builtin.file:
        src: ~/.config/jj/config.toml
        dest: "{{ dest }}"
        state: link
      vars:
        dest: "{{ jj_config_path_user.stdout }}"

  # TODO Initialize ~/src/boxen to use jj

- import_playbook: defaults.yml

- tags: dock
  hosts: macos
  tasks:
    - name: Install dockutil
      homebrew:
        name: dockutil
        state: present

    - name: Get dock icons
      ansible.builtin.command: dockutil --list
      register: dockutil_result

    - name: Remove all dock icons
      ansible.builtin.command: dockutil --remove all

    - name: Add ~/Downloads to the Dock
      ansible.builtin.command: |
        dockutil --add ~/Downloads
          --view list
          --display stack
          --sort datemodified
      when: not (dockutil_result.stdout_lines | length == 1 and dockutil_result.stdout is search("^Downloads"))

    - name: Remove dockutil
      homebrew:
        name: dockutil
        state: absent

    - name: Restart dock
      ansible.builtin.command: killall Dock

- tags: library
  hosts: macos
  tasks:

    - name: Create ~/Library directories
      ansible.builtin.file:
        path: ~/Library/{{ item }}
        state: directory
        mode: '0755'
      loop:
        - Colors
        - Dictionaries
        - KeyBindings

    - name: Symlink Emacs-style keybindings for OS X
      ansible.builtin.file:
        src: ~/.dotfiles/macos/DefaultKeyBinding.dict
        dest: ~/Library/KeyBindings/DefaultKeyBinding.dict
        state: link

    - name: Symlink OS X colors palettes
      ansible.builtin.file:
        src: "{{ item }}"
        dest: ~/Library/Colors/{{ item | basename }}
        state: link
      with_fileglob: ~/.dotfiles/macos/colors/*

    - name: Install Webster's 1913 dictionary
      ansible.builtin.copy:
        src: ~/.dotfiles/macos/websters-1913.dictionary/
        dest: ~/Library/Dictionaries/websters-1913.dictionary
        mode: "644"

- tags: system
  hosts: macos
  tasks:

    - name: Enable Touch ID for sudo
      become: true
      ansible.builtin.lineinfile:
        path: /etc/pam.d/sudo
        insertafter: '^auth\s+sufficient'
        regexp: '^auth\s+sufficient\s+pam_tid.so$'
        line: "auth       sufficient     pam_tid.so"

    - name: Enable Touch ID for sudo in tmux
      become: true
      ansible.builtin.lineinfile:
        path: /etc/pam.d/sudo
        insertbefore: '^auth\tsufficient\tpam_tid.so'
        regexp: '^auth\s+optional\s+.*pam_reattach.so$'
        line: "auth       optional       /opt/homebrew/lib/pam/pam_reattach.so"

    # https://infosec.exchange/@briankrebs/111434555426146154
    - name: Change TTL to 65 for fooling tethering detection
      become: true
      ansible.builtin.command: sysctl -w {{ item }}=65
      loop:
        - net.inet.ip.ttl
        - net.inet6.ip6.hlim
      changed_when: true

