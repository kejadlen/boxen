- name: Main playbook
  hosts: local
  tasks:

    - name: Check out dotfiles
      ansible.builtin.git:
        repo: https://git.kejadlen.dev/alpha/dotfiles.git
        dest: ~/.dotfiles
        version: main
        accept_newhostkey: true
      # this repo often has local changes
      ignore_errors: true # noqa: ignore-errors

    - name: Symlink shallow dotfiles
      ansible.builtin.file:
        src: ~/.dotfiles/{{ item }}
        dest: ~/{{ item }}
        state: link
      loop:
        - .config
        - .digrc
        - .gemrc
        - .gitconfig
        - .hammerspoon
        - .inputrc
        - .local
        - .p10k.zsh
        - .profile
        - .ruby-version
        - .tmux.conf
        - .zsh
        - .zshenv
        - .zshrc

    - name: Symlink deep dotfiles
      block:
        - name: Ensure directory exists
          ansible.builtin.file:
            dest: ~/{{ item | dirname }}
            state: directory
          loop: "{{ dotfiles }}"
        - name: Symlink dotfile
          ansible.builtin.file:
            src: ~/.dotfiles/{{ item }}
            dest: ~/{{ item }}
            state: link
          loop: "{{ dotfiles }}"
      vars:
        dotfiles:
          - .bundle/config
          - .cargo/config.toml
          - .docker/config.json

- import_playbook: macos.yml # noqa: name[play]

# needs to go after luarocks is installed
- name: Main playbook
  hosts: local
  tasks:
    - name: Install fennel
      ansible.builtin.command: luarocks install fennel
      args:
        creates: /opt/homebrew/bin/fennel

