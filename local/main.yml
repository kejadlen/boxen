- hosts: local
  tasks:
    - name: Check out dotfiles
      ansible.builtin.git:
        repo: https://git.kejadlen.dev/alpha/dotfiles.git
        dest: ~/.dotfiles
        version: main
        accept_newhostkey: true
      # this repo often has local changes
      ignore_errors: true # noqa: ignore-errors

    - name: Symlink shallow dotfiles
      ansible.builtin.file:
        src: ~/.dotfiles/{{ item }}
        dest: ~/{{ item }}
        state: link
      loop:
        - .config
        - .digrc
        - .gemrc
        - .gitconfig
        - .hammerspoon
        - .inputrc
        - .local
        - .p10k.zsh
        - .profile
        - .ruby-version
        - .tmux.conf
        - .zsh
        - .zshenv
        - .zshrc

    - name: Symlink deep dotfiles
      vars:
        dotfiles:
          - .bundle/config
          - .cargo/config.toml
          - .docker/config.json
      block:
        - name: Ensure directory exists
          ansible.builtin.file:
            dest: ~/{{ item | dirname }}
            state: directory
            mode: "0755"
          loop: "{{ dotfiles }}"
        - name: Symlink dotfile
          ansible.builtin.file:
            src: ~/.dotfiles/{{ item }}
            dest: ~/{{ item }}
            state: link
          loop: "{{ dotfiles }}"

- import_playbook: macos.yml

# Misc things that can (or need to) wait on the above to run
- hosts: local
  tasks:

    # https://tratt.net/laurie/blog/2024/faster_shell_startup_with_shell_switching.html
    - name: Set default shell to sh
      ansible.builtin.user:
        name: alpha
        shell: /bin/sh --login

    # needs to go after luarocks is installed
    - name: Install fennel
      ansible.builtin.command: luarocks install fennel
      args:
        creates: /opt/homebrew/bin/fennel

