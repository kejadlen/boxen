global:
  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  # external_labels:
  #   monitor: 'codelab-monitor'

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: docker
    static_configs:
      - targets: ['host.docker.internal:9323']

  - job_name: caddy
    static_configs:
      - targets: ['caddy:2019']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: postgres
    static_configs:
      - targets: ['host.docker.internal:9187']

  - job_name: promtail
    static_configs:
      - targets: ['promtail:9080']

  - job_name: miniflux
    static_configs:
      - targets: ['miniflux:8080']

  # - job_name: woodpecker
  #   bearer_token: {{ woodpecker.api_token }}
  #   static_configs:
  #     - targets: ['woodpecker-server:8000']

  - job_name: authelia
    static_configs:
      - targets: ['authelia:9959']

  # - job_name: linode
  #   linode_sd_configs:
  #     - authorization:
  #         credentials: {{ prometheus.linode_api_token }}
  #   relabel_configs:
  #     # Use the public IPv6 address and port 9100 to scrape the target.
  #     - source_labels: [__meta_linode_public_ipv6]
  #       target_label: __address__
  #       replacement: "[$1]:9100"

  - job_name: akkoma
    scheme: https
    authorization:
      credentials: {{ prometheus.akkoma.access_token }}
    metrics_path: /api/v1/akkoma/metrics
    static_configs:
    - targets:
      - {{ prometheus.akkoma.target }}

  - job_name: paperless
    metrics_path: /flower/metrics
    static_configs:
      - targets: ['paperless-ngx:5555']

  - job_name: gotosocial
    metrics_path: /metrics
    scheme: http
    basic_auth:
      username: {{ prometheus.gotosocial.username }}
      password: {{ prometheus.gotosocial.password }}
    static_configs:
      - targets: ['gotosocial:8080']
