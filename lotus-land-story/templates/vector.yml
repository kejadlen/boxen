sources:
  docker:
    type: docker_logs
  varlogs:
    type: file
    include:
      - /var/log/fail2ban.log

transforms:
  docker_parsed:
    type: remap
    inputs:
      - docker
    source: |
      ._stream_id = .container_id

      ._time = del(.timestamp)

      if .container_name == "caddy" {
        # Startup errors and panics go to stderr as plain text.
        parsed, err = parse_json(.message)
        if err == null && is_object(parsed) {
          . = merge!(., parsed)
          ._time = del(.ts)
          ._msg = del(.msg)
        }
      } else if .container_name == "gotosocial" {
        . = merge(., parse_key_value!(.message))
        ._time = parse_timestamp!(del(.timestamp), format: "%d/%m/%Y %H:%M:%S%.3f")
        ._msg = del(.msg)
      } else if .container_name == "grafana" {
        . = merge(., parse_key_value!(.message))
        ._time = del(.t)
        ._msg = del(.msg)
      }

      if ._msg == null {
        ._msg = .message
      }
      del(.message)

  varlogs_parsed:
    type: remap
    inputs:
      - varlogs
    source: |
      parsed = parse_regex!(del(.message), r'^(?P<date>.*?) (?P<time>.*?) (?P<component>.*?) *\[(?P<proc_id>.*?)\]: (?P<level>.*?) +(?P<message>.*?)$')
      . = merge(., parsed)

      ._msg = del(.message)

      t = join!([del(.date), del(.time)], separator: " ")
      ._time = parse_timestamp!(t, format: "%Y-%m-%d %H:%M:%S,%3f")

      ._stream_id = .file

sinks:
  victoria_logs:
    inputs:
      - docker_parsed
      - varlogs_parsed
    type: http
    uri: http://victoria-logs:9428/insert/jsonline?_stream_fields=container_id,container_name,file
    compression: gzip
    encoding:
      codec: json
    framing:
      method: newline_delimited
    healthcheck:
      enabled: false
