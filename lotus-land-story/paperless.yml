- name: Set up Paperless-ngx
  hosts: lotus-land-story
  vars_files:
    - vars.yml
  vars:
    version: 2.5.1
  tasks:

    - name: Create directories for volume mounting
      ansible.builtin.file:
        path: /mnt/lotus-land-story/paperless/{{ item }}
        state: directory
        mode: "0700"
      loop:
        - consume
        - data
        - export
        - media

    - name: Celery monitoring configuration
      ansible.builtin.copy:
        content: |
          url_prefix = "/flower/"
        dest: /mnt/lotus-land-story/paperless/flowerconfig.py
        mode: "0644"

    - name: Get docker network
      community.docker.docker_network:
        name: lotus_land_story
      register: docker_network

    # https://github.com/paperless-ngx/paperless-ngx/blob/main/docker/compose/docker-compose.sqlite.yml
    - name: Run Paperless-ngx
      community.docker.docker_container:
        restart: true
        name: paperless
        image: ghcr.io/paperless-ngx/paperless-ngx:{{ version }}
        env:
          PAPERLESS_ENABLE_FLOWER: "true"
          PAPERLESS_ENABLE_HTTP_REMOTE_USER: "true"
          PAPERLESS_OCR_USER_ARGS: '{"continue_on_soft_render_error": true}'
          PAPERLESS_REDIS: redis://host.docker.internal:6379
          PAPERLESS_TIME_ZONE: America/Los_Angeles
          PAPERLESS_URL: https://paperless.{{ domain }}
          PAPERLESS_WEBSERVER_WORKERS: "1"
        volumes:
          - /mnt/lotus-land-story/paperless/data:/usr/src/paperless/data
          - /mnt/lotus-land-story/paperless/media:/usr/src/paperless/media
          - /mnt/lotus-land-story/paperless/export:/usr/src/paperless/export
          - /mnt/lotus-land-story/paperless/consume:/usr/src/paperless/consume
          - /mnt/lotus-land-story/paperless/flowerconfig.py:/usr/src/paperless/src/paperless/flowerconfig.py:ro
        restart_policy: unless-stopped
        networks:
          - name: lotus_land_story
        etc_hosts:
          host.docker.internal: host-gateway


  handlers:
    - name: Import restarts
      ansible.builtin.import_tasks: restarts.yml

