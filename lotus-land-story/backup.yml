- name: Backup
  hosts: lotus-land-story
  vars:
    primary_repository: sftp:restic@mountain-of-faith:/mnt/mountain-of-faith/restic
    secondary_repository: sftp:restic@legacy-of-lunatic-kingdom:/mnt/legacy-of-lunatic-kingdom/restic
  tasks:

    - name: Install Restic
      ansible.builtin.package:
        name: restic
        state: present

    - name: Update Restic
      ansible.builtin.command: restic self-update

    - name: Generate SSH key
      community.crypto.openssh_keypair:
        path: ~/.ssh/id_ed25519
        type: ed25519

    # The backup script sftp's to this host as restic@, which fails closed on
    # an unknown host key. Ansible's own connections don't populate known_hosts.
    - name: Read legacy-of-lunatic-kingdom host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      delegate_to: legacy-of-lunatic-kingdom
      register: lolk_host_key

    - name: Trust legacy-of-lunatic-kingdom host key
      ansible.builtin.known_hosts:
        name: legacy-of-lunatic-kingdom
        key: "legacy-of-lunatic-kingdom {{ lolk_host_key.content | b64decode }}"

    # restic copy fails on a missing destination, and --copy-chunker-params
    # keeps dedup working across the two repositories.
    - name: Check for secondary Restic repository
      ansible.builtin.command:
        cmd: restic --repo {{ secondary_repository }} cat config
      environment:
        RESTIC_PASSWORD: "{{ restic.password }}"
      register: secondary_repo
      changed_when: false
      failed_when: false

    - name: Initialize secondary Restic repository
      ansible.builtin.command: >-
        restic --repo {{ secondary_repository }}
        init --from-repo {{ primary_repository }} --copy-chunker-params
      environment:
        RESTIC_PASSWORD: "{{ restic.password }}"
        RESTIC_FROM_PASSWORD: "{{ restic.password }}"
      when: secondary_repo.rc != 0

    - name: Set up daily backup
      ansible.builtin.template:
        src: templates/backup.sh
        dest: /etc/cron.daily/backup
        mode: '0700'

