- name: VictoriaTraces
  tags: victoria-traces
  hosts: lotus-land-story
  vars:
    version: "{{ versions.victoria_traces }}"
  tasks:

    - name: Make directories
      ansible.builtin.file:
        path: /mnt/lotus-land-story/victoria-traces
        state: directory
        mode: "0755"

    - name: Install victoria-traces systemd unit
      ansible.builtin.template:
        src: templates/systemd/victoria-traces.service
        dest: /etc/systemd/system/victoria-traces.service
        mode: "0644"
      notify: Restart victoria-traces

    - name: Enable and start victoria-traces
      ansible.builtin.systemd_service:
        name: victoria-traces
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart victoria-traces
      ansible.builtin.systemd_service:
        name: victoria-traces
        state: restarted
        daemon_reload: true

