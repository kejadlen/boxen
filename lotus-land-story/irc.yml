- name: Run IRC
  hosts: lotus-land-story
  vars:
    gamja_version: caf6e99
    soju_version: 0.10.0 # remember to update the docker-soju image to bump this
  tasks:

    - name: Make directories
      ansible.builtin.file:
        path: /mnt/lotus-land-story/{{ item }}
        state: directory
        mode: "0755"
      loop:
        - caddy/data/gamja
        - soju

    - name: Download Gamja
      ansible.builtin.unarchive:
        src: https://github.com/kejadlen/gamja-build/releases/download/gamja-{{ gamja_version }}/gamja.tar.gz
        dest: /mnt/lotus-land-story/caddy/data/gamja
        remote_src: true

    - name: Configure Soju
      ansible.builtin.copy:
        dest: /mnt/lotus-land-story/soju/soju.conf
        content: |
          # listen unix+admin://
          listen irc+insecure://0.0.0.0:6697
          listen ws+insecure://0.0.0.0:3030
          listen http+prometheus://localhost:9090

          db sqlite3 /soju/soju.db
        mode: "0600"

    - name: Get docker network
      community.docker.docker_network:
        name: lotus_land_story
      register: docker_network

    - name: Run Soju
      community.docker.docker_container:
        restart: true
        name: soju
        image: ghcr.io/kejadlen/soju:{{ soju_version }}
        restart_policy: unless-stopped
        volumes:
          - /mnt/lotus-land-story/soju:/soju
        ports:
          - "6697:6697"
        networks:
          - name: lotus_land_story
        # etc_hosts:
        #   host.docker.internal: host-gateway

  handlers:
    - name: Import restarts
      ansible.builtin.import_tasks: restarts.yml

