- name: Set up Dockhand
  hosts: lotus-land-story
  vars:
    version: 1.0.42
  tasks:

    - name: Create data directory for Dockhand
      ansible.builtin.file:
        path: /mnt/lotus-land-story/dockhand
        state: directory
        mode: "0755"

    - name: Run Dockhand
      community.docker.docker_container:
        name: dockhand
        image: fnsys/dockhand:v{{ version }}
        restart: true
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /mnt/lotus-land-story/dockhand:/app/data
        restart_policy: unless-stopped
        networks:
          - name: lotus_land_story

