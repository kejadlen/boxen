- name: Set up Grafana
  hosts: lotus-land-story
  vars:
    version: "{{ versions.grafana }}"
  tasks:

    - name: Grafana user
      ansible.builtin.user:
        name: grafana
      register: grafana_user

    - name: Create Grafana dir
      ansible.builtin.file:
        path: /mnt/lotus-land-story/grafana/provisioning/{{ item }}
        state: directory
        mode: "0755"
        owner: "{{ grafana_user.name }}"
      loop:
        - datasources

    - name: Configure Grafana
      ansible.builtin.copy:
        dest: /mnt/lotus-land-story/grafana/grafana.ini
        content: |
          [log]
          # level = debug

          [metrics]
          enabled             = true
          disable_total_stats = false

          [server]
          domain = grafana
          http_addr = 0.0.0.0
          root_url = https://grafana

          # https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/configure-authentication/auth-proxy/
          [auth]
          disable_signout_menu = true

          [auth.proxy]
          enabled = true
          header_name = X-WEBAUTH-USER
          header_property = email
          auto_sign_up = false

          [smtp]
          enabled = true
          host = smtp.sendgrid.net:465
          user = apikey
          password = {{ grafana.smtp_password }}
          from_address = grafana@kejadlen.dev

          [plugins]
          plugin_admin_enabled = true
        mode: "0600"
        owner: "{{ grafana_user.name }}"

    - name: Provision VictoriaLogs
      ansible.builtin.copy:
        dest: /mnt/lotus-land-story/grafana/provisioning/datasources/victoria-logs.yml
        content: |
          apiVersion: 1

          datasources:
            - name: VictoriaLogs
              type: victoriametrics-logs-datasource
              access: proxy
              url: http://victoria-logs:9428
        mode: "0644"

    - name: Provision VictoriaMetrics
      ansible.builtin.copy:
        dest: /mnt/lotus-land-story/grafana/provisioning/datasources/victoria-metrics.yml
        content: |
          apiVersion: 1

          # List of data sources to insert/update depending on what's
          # available in the database.
          datasources:
            # <string, required> Name of the VictoriaMetrics datasource
            # displayed in Grafana panels and queries.
            - name: VictoriaMetrics
              # <string, required> Sets the data source type.
              type: victoriametrics-metrics-datasource
                # <string, required> Sets the access mode, either
                # proxy or direct (Server or Browser in the UI).
                # Some data sources are incompatible with any setting
              # but proxy (Server).
              access: proxy
              # <string> Sets default URL of the single node version of VictoriaMetrics
              url: http://victoria-metrics:8428
              # <string> Sets the pre-selected datasource for new panels.
              # You can set only one default data source per organization.
              isDefault: true
        mode: "0644"

    - name: Create Grafana data dir
      ansible.builtin.file:
        path: /mnt/lotus-land-story/grafana/data
        state: directory
        mode: "0755"
        owner: "{{ grafana_user.name }}"

    - name: Run Grafana
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:{{ version }}
        volumes:
          - /mnt/lotus-land-story/grafana/grafana.ini:/etc/grafana/grafana.ini
          - /mnt/lotus-land-story/grafana/provisioning:/etc/grafana/provisioning
          - /mnt/lotus-land-story/grafana/data:/var/lib/grafana
        env:
          GF_PLUGINS_PREINSTALL: victoriametrics-logs-datasource, victoriametrics-metrics-datasource
        restart_policy: unless-stopped
        networks:
          - name: lotus_land_story
        etc_hosts:
          host.docker.internal: host-gateway
        user: "{{ grafana_user.uid }}"

