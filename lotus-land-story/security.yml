- name: Set up firewall
  tags: ufw
  hosts: lotus-land-story
  tasks:

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Allow access from tailscale
      community.general.ufw:
        rule: allow
        interface_in: tailscale0
      notify: Reload ufw

    - name: Get docker network for ufw
      community.docker.docker_network:
        name: lotus_land_story
      register: docker_network

    - name: Allow access from docker network
      community.general.ufw:
        rule: allow
        from_ip: "{{ docker_network.network.IPAM.Config[0].Subnet }}"
      notify: Reload ufw

    # SSH arrives over tailscale0, which the rule above allows.
    - name: Close public SSH
      community.general.ufw:
        rule: allow
        name: OpenSSH
        delete: true
      notify: Reload ufw

    - name: Disable password auth via SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: ^PasswordAuthentication
        line: PasswordAuthentication no
      notify: Restart ssh

  handlers:
    - name: Import restarts
      ansible.builtin.import_tasks: restarts.yml


# Can use `fail2ban-client status sshd` to check on this
- name: Set up Fail2Ban
  tags: fail2ban
  hosts: lotus-land-story
  tasks:

    - name: Install Fail2Ban
      ansible.builtin.apt:
        name: fail2ban
        state: present

    # TODO Reload fail2ban if this changes

    - name: Configure Fail2Ban for sshd
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        content: |
          [sshd]
          enabled = true
          mode = aggressive
          bantime = 1w
          findtime = 12h
        mode: "0600"

    - name: Start Fail2Ban
      ansible.builtin.service:
        name: fail2ban
        state: started

