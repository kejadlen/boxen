- name: Set up firewall
  tags: ufw
  hosts: lotus-land-story
  tasks:

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Allow access from tailscale
      community.general.ufw:
        rule: allow
        interface_in: tailscale0
      notify: Reload ufw

    - name: Get docker network for ufw
      community.docker.docker_network:
        name: lotus_land_story
      register: docker_network

    - name: Allow access from docker network
      community.general.ufw:
        rule: allow
        from_ip: "{{ docker_network.network.IPAM.Config[0].Subnet }}"
      notify: Reload ufw

    # for gitea from work laptop
    - name: Allow SSH access
      community.general.ufw:
        rule: allow
        name: OpenSSH
      notify: Reload ufw

    - name: Disable password auth via SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: ^PasswordAuthentication
        line: PasswordAuthentication no
      notify: Restart ssh

  handlers:
    - name: Import restarts
      ansible.builtin.import_tasks: restarts.yml

- name: Set up Fail2Ban
  tags: fail2ban
  hosts: lotus-land-story
  tasks:

    - name: Install Fail2Ban
      ansible.builtin.apt:
        name: fail2ban
        state: present

    - name: Configure Fail2Ban
      ansible.builtin.copy:
        dest: /etc/jail.local
        content: |
          [sshd]
          enabled = true
        mode: "0600"

    - name: Start Fail2Ban
      ansible.builtin.service:
        name: fail2ban
        state: started

