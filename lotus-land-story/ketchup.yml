- name: Set up Ketchup
  hosts: lotus-land-story
  vars:
    version: "{{ versions.ketchup }}"
  tasks:

    - name: Create data directory for Ketchup
      ansible.builtin.file:
        path: /mnt/lotus-land-story/ketchup
        state: directory
        mode: "0755"

    - name: Run Ketchup
      community.docker.docker_container:
        name: ketchup
        image: ghcr.io/kejadlen/ketchup:{{ version }}
        pull: true
        restart: true
        env:
          AUTH_HEADER: Tailscale-User-Login
          DATABASE_URL: /data/ketchup.db
          SESSION_SECRET: "{{ ketchup.session_secret }}"
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: https://api.honeycomb.io
          OTEL_EXPORTER_OTLP_HEADERS: "{{ ketchup.otel_exporter_otlp_headers }}"
          TZ: America/Los_Angeles
        volumes:
          - /mnt/lotus-land-story/ketchup:/data
        restart_policy: unless-stopped
        networks:
          - name: lotus_land_story
      no_log: true

