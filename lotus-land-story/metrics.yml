- name: VictoriaMetrics
  hosts: lotus-land-story
  vars_files:
    - vars.yml
  vars:
    version: v1.119.0
  tasks:

    - name: Make directories
      ansible.builtin.file:
        path: /mnt/lotus-land-story/{{ item }}
        state: directory
        mode: "0755"
      loop:
        - victoria-metrics

    - name: Get docker network
      community.docker.docker_network:
        name: lotus_land_story
      register: docker_network

    - name: Run VictoriaMetrics
      community.docker.docker_container:
        restart: true
        name: victoria-metrics
        image: victoriametrics/victoria-metrics:{{ version }}
        command: --selfScrapeInterval=5s -storageDataPath=victoria-metrics-data
        restart_policy: unless-stopped
        volumes:
          - /mnt/lotus-land-story/victoria-metrics:/victoria-metrics-data
        networks:
          - name: lotus_land_story

  handlers:
    - name: Import restarts
      ansible.builtin.import_tasks: restarts.yml

