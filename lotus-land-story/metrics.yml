- name: VictoriaMetrics
  hosts: lotus-land-story
  vars:
    version: v1.145.0
    cadvisor_version: 0.57.0
  tasks:

    - name: Make directories
      ansible.builtin.file:
        path: /mnt/lotus-land-story/victoria-metrics/data
        state: directory
        mode: "0755"

    - name: Configure scrape.yml
      ansible.builtin.template:
        dest: /mnt/lotus-land-story/victoria-metrics/scrape.yml
        src: templates/scrape.yml
        mode: "0600"

    - name: Get docker network
      community.docker.docker_network:
        name: lotus_land_story
      register: docker_network

    - name: Run VictoriaMetrics
      community.docker.docker_container:
        restart: true
        name: victoria-metrics
        image: victoriametrics/victoria-metrics:{{ version }}
        command:
          - --selfScrapeInterval=5s
          - -storageDataPath=victoria-metrics-data
          - -promscrape.config=scrape.yml
        restart_policy: unless-stopped
        volumes:
          - /mnt/lotus-land-story/victoria-metrics/data:/victoria-metrics-data
          - /mnt/lotus-land-story/victoria-metrics/scrape.yml:/scrape.yml
        networks:
          - name: lotus_land_story
        etc_hosts:
          host.docker.internal: host-gateway

    - name: Run cAdvisor
      tags: cadvisor
      community.docker.docker_container:
        name: cadvisor
        image: ghcr.io/google/cadvisor:{{ cadvisor_version }}
        restart: true
        command:
          # https://github.com/google/cadvisor/issues/2523#issuecomment-2258042352
          - "--housekeeping_interval=30s"
          - "--docker_only=true"
          - "--store_container_labels=false"
        volumes:
          - /:/rootfs:ro
          - /var/run:/var/run:rw
          - /sys:/sys:ro
          - /var/lib/docker/:/var/lib/docker:ro
          # - /etc/machine-id:/etc/machine-id:ro
        restart_policy: unless-stopped
        networks:
          - name: lotus_land_story

  handlers:
    - name: Import restarts
      ansible.builtin.import_tasks: restarts.yml

