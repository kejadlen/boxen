- name: VictoriaLogs
  tags: victoria-logs
  hosts: lotus-land-story
  vars:
    version: "{{ versions.victoria_logs }}"
  tasks:

    - name: Make directories
      ansible.builtin.file:
        path: /mnt/lotus-land-story/{{ item }}
        state: directory
        mode: "0755"
      loop:
        - victoria-logs

    - name: Get docker network
      community.docker.docker_network:
        name: lotus_land_story
      register: docker_network

    - name: Run VictoriaLogs
      community.docker.docker_container:
        restart: true
        name: victoria-logs
        image: docker.io/victoriametrics/victoria-logs:{{ version }}
        command: -storageDataPath=/data -syslog.listenAddr.tcp=:514
        restart_policy: unless-stopped
        ports:
          - "127.0.0.1:514:514"   # syslog, from the local rsyslog only
          # For tailnet shippers until they've all moved to https://logs.
          - "9428:9428"
        volumes:
          - /mnt/lotus-land-story/victoria-logs:/data
        networks:
          - name: lotus_land_story

    # journald carries the same messages, through journal-upload.
    - name: Stop shipping syslogs
      ansible.builtin.file:
        path: /etc/rsyslog.d/50-promtail.conf
        state: absent
      notify: Restart rsyslog

  handlers:
    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted

