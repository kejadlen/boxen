- name: Set up Vector
  tags: vector
  hosts: lotus-land-story
  vars:
    version: 0.52.0
  tasks:

    - name: Create Vector config dir
      ansible.builtin.file:
        path: /mnt/lotus-land-story/vector
        state: directory
        mode: "0700"

    - name: Configure Vector
      ansible.builtin.copy:
        src: templates/vector.yml
        dest: /mnt/lotus-land-story/vector/vector.yml

    - name: Run Vector
      community.docker.docker_container:
        name: vector
        image: timberio/vector:{{ version }}-debian
        restart: true
        command: -c /etc/vector/*.yml
        volumes:
          - /mnt/lotus-land-story/vector:/etc/vector:ro
          - /var/log:/var/log
          - /var/run/docker.sock:/var/run/docker.sock
        restart_policy: unless-stopped
        networks:
          - name: lotus_land_story

    - name: Set up logrotate for gitea.log
      ansible.builtin.copy:
        content: |
          /var/log/gitea.log
          {
            rotate 4
            weekly
            missingok
            notifempty
            compress
            delaycompress
          }
        dest: /etc/logrotate.d/gitea-ssh
        mode: "0600"

- name: VictoriaLogs
  tags: victoria-logs
  hosts: lotus-land-story
  vars_files:
    - vars.yml
  vars:
    version: 1.24.0
  tasks:

    - name: Make directories
      ansible.builtin.file:
        path: /mnt/lotus-land-story/{{ item }}
        state: directory
        mode: "0755"
      loop:
        - victoria-logs

    - name: Get docker network
      community.docker.docker_network:
        name: lotus_land_story
      register: docker_network

    - name: Run VictoriaLogs
      community.docker.docker_container:
        restart: true
        name: victoria-logs
        image: docker.io/victoriametrics/victoria-logs:v{{ version }}-victorialogs
        command: -storageDataPath=/data -syslog.listenAddr.tcp=:514
        restart_policy: unless-stopped
        ports:
          - "514:514"   # syslog
          # Exposed for journald via systemd-journal-upload - at some point, it
          # might be nice to have journald go through vector, but would need to
          # figure out how to make that work through docker.
          - "9428:9428"
        volumes:
          - /mnt/lotus-land-story/victoria-logs:/data
        networks:
          - name: lotus_land_story

    - name: Ship syslogs
      ansible.builtin.copy:
        content: |
          *.* action(type="omfwd"
                     protocol="tcp"
                     target="127.0.0.1"
                     port="514"
                     Template="RSYSLOG_SyslogProtocol23Format"
                     TCP_Framing="octet-counted"
                     KeepAlive="on")
        dest: /etc/rsyslog.d/50-promtail.conf
        mode: "0644"
      notify: Restart rsyslog

    - name: Ship journald logs
      block:

        - name: Install systemd-journal-remote
          ansible.builtin.apt:
            name: systemd-journal-remote
            state: present

        - name: Set remote URL for uploading
          ansible.builtin.lineinfile:
            path: /etc/systemd/journal-upload.conf
            regexp: '^URL='
            insertafter: '^# URL='
            line: URL=http://localhost:9428/insert/journald

        - name: Run systemd-journal-remote
          ansible.builtin.service:
            name: systemd-journal-upload
            state: started

  handlers:
    - name: Import restarts
      ansible.builtin.import_tasks: restarts.yml

