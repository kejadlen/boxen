- name: VictoriaLogs
  hosts: lotus-land-story
  vars_files:
    - vars.yml
  vars:
    victoria_logs_version: 1.20.0
  tasks:

    - name: Make directories
      ansible.builtin.file:
        path: /mnt/lotus-land-story/{{ item }}
        state: directory
        mode: "0755"
      loop:
        - victoria-logs

    - name: Get docker network
      community.docker.docker_network:
        name: lotus_land_story
      register: docker_network

    - name: Run VictoriaLogs
      community.docker.docker_container:
        restart: true
        name: victoria-logs
        image: docker.io/victoriametrics/victoria-logs:v{{ victoria_logs_version }}-victorialogs
        restart_policy: unless-stopped
        volumes:
          - /mnt/lotus-land-story/victoria-logs:/data
        networks:
          - name: lotus_land_story
        # etc_hosts:
        #   host.docker.internal: host-gateway

  handlers:
    - name: Import restarts
      ansible.builtin.import_tasks: restarts.yml

