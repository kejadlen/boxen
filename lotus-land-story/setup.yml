- name: Set up setup
  hosts: lotus-land-story
  tasks:

    - name: Copy files
      ansible.builtin.copy:
        src: templates/setup
        dest: /mnt/lotus-land-story/caddy/data
        mode: '0400'

    - name: Copy cert
      ansible.builtin.copy:
        src: /mnt/lotus-land-story/caddy/data/caddy/pki/authorities/local/root.crt
        dest: /mnt/lotus-land-story/caddy/data/setup/root.pem
        remote_src: true
        mode: '0400'

# vim: ft=yaml.ansible
