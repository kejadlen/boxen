- name: Set up Prometheus
  hosts: lotus-land-story
  vars_files:
    - vars.yml
  vars:
    prometheus_version: v2.54.1
    cadvisor_version: v0.51.0
  tasks:

    - name: Install host exporters
      ansible.builtin.apt:
        pkg:
          - prometheus-node-exporter
        state: present

    - name: Configure node-exporter
      ansible.builtin.lineinfile:
        dest: /etc/default/prometheus-node-exporter
        regexp: '^ARGS='
        # Include filesystems under /mnt
        line: ARGS='--collector.filesystem.ignored-mount-points="^/(dev|proc|run|sys|media|var/lib/docker/.+)($|/)"'
        state: present

    - name: Create Prometheus dir
      ansible.builtin.file:
        path: /mnt/lotus-land-story/prometheus
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"

    - name: Prometheus config
      ansible.builtin.template:
        dest: /mnt/lotus-land-story/prometheus/prometheus.yml
        src: templates/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: "0600"

    - name: Create Prometheus volume
      community.docker.docker_volume:
        name: prometheus

    - name: Get prometheus user info
      ansible.builtin.user:
        name: prometheus
      register: prometheus_user

    - name: Run Prometheus
      community.docker.docker_container:
        name: prometheus
        image: prom/prometheus:{{ prometheus_version }}
        command:
          - --config.file=/etc/prometheus/prometheus.yml
          - --storage.tsdb.retention.size=5GB
          - --log.format=json
        restart: true
        user: "{{ prometheus_user.uid }}"
        groups: "{{ prometheus_user.group }}"
        volumes:
          - /mnt/lotus-land-story/prometheus:/etc/prometheus
          - prometheus:/prometheus
        restart_policy: unless-stopped
        networks:
          - name: lotus_land_story
        etc_hosts:
          host.docker.internal: host-gateway

    - name: Run cAdvisor
      community.docker.docker_container:
        name: cadvisor
        image: gcr.io/cadvisor/cadvisor:{{ cadvisor_version }}
        restart: true
        command:
          #https://github.com/google/cadvisor/issues/2523#issuecomment-2258042352
          - "--housekeeping_interval=30s"
          - "--docker_only=true"
          - "--store_container_labels=false"
        volumes:
          - /:/rootfs:ro
          - /var/run:/var/run:rw
          - /sys:/sys:ro
          - /var/lib/docker/:/var/lib/docker:ro
          - /etc/machine-id:/etc/machine-id:ro
        restart_policy: unless-stopped
        networks:
          - name: lotus_land_story

- name: Set up postgres-exporter
  hosts: lotus-land-story
  vars_files:
    - vars.yml
  vars:
    version: v0.16.0
  tags:
    - postgres-exporter
  tasks:
    # https://github.com/prometheus-community/postgres_exporter?tab=readme-ov-file#running-as-non-superuser
    - name: Set up postgres_exporter user
      become: true
      become_user: postgres
      community.postgresql.postgresql_query:
        query: |
          -- To use IF statements, hence to be able to check if the user exists before
          -- attempting creation, we need to switch to procedural SQL (PL/pgSQL)
          -- instead of standard SQL.
          -- More: https://www.postgresql.org/docs/9.3/plpgsql-overview.html
          -- To preserve compatibility with <9.0, DO blocks are not used; instead,
          -- a function is created and dropped.
          CREATE OR REPLACE FUNCTION __tmp_create_user() returns void as $$
          BEGIN
            IF NOT EXISTS (
                    SELECT                       -- SELECT list can stay empty for this
                    FROM   pg_catalog.pg_user
                    WHERE  usename = 'postgres_exporter') THEN
              CREATE USER postgres_exporter;
            END IF;
          END;
          $$ language plpgsql;

          SELECT __tmp_create_user();
          DROP FUNCTION __tmp_create_user();

          ALTER USER postgres_exporter WITH PASSWORD '{{ prometheus.postgres_exporter.password }}';
          ALTER USER postgres_exporter SET SEARCH_PATH TO postgres_exporter,pg_catalog;

          -- If deploying as non-superuser (for example in AWS RDS), uncomment the GRANT
          -- line below and replace <MASTER_USER> with your root user.
          -- GRANT postgres_exporter TO <MASTER_USER>;

          GRANT CONNECT ON DATABASE postgres TO postgres_exporter;
          GRANT pg_monitor to postgres_exporter;

    - name: Allow postgres_exporter to connect to postgres
      community.postgresql.postgresql_pg_hba:
        dest: /etc/postgresql/13/main/pg_hba.conf
        contype: host
        users: postgres_exporter
        source: samenet # TODO Can this be restricted to docker_ip?
        databases: postgres
        create: true
      notify: Restart postgres

    # https://github.com/prometheus-community/postgres_exporter
    - name: Run postgres-exporter
      community.docker.docker_container:
        name: postgres-exporter
        image: quay.io/prometheuscommunity/postgres-exporter:{{ version }}
        restart: true
        env:
          DATA_SOURCE_URI: host.docker.internal
          DATA_SOURCE_USER: postgres_exporter
          DATA_SOURCE_PASS: "{{ prometheus.postgres_exporter.password }}"
        restart_policy: unless-stopped
        networks:
          - name: lotus_land_story
        etc_hosts:
          host.docker.internal: host-gateway

  handlers:
    - name: Import restarts
      ansible.builtin.import_tasks: restarts.yml

