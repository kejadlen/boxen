- name: Restart postgres
  ansible.builtin.service:
    name: postgresql
    state: restarted

- name: Restart docker
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Reload ufw
  community.general.ufw:
    state: reloaded

- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

