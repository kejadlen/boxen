- name: Set up Calibre-web
  hosts: lotus-land-story
  vars:
    version: "{{ versions.calibre_web }}"
    volumes:
      /mnt/lotus-land-story/calibre-web/books: /books
      /mnt/lotus-land-story/calibre-web/config: /config
  tasks:

    - name: Create directories for volume mounting
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ volumes.keys() | list }}"

    # https://github.com/linuxserver/docker-calibre-web
    - name: Install calibre-web systemd unit
      ansible.builtin.template:
        src: templates/systemd/calibre-web.service
        dest: /etc/systemd/system/calibre-web.service
        mode: "0644"
      notify: Restart calibre-web

    - name: Enable and start calibre-web
      ansible.builtin.systemd_service:
        name: calibre-web
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart calibre-web
      ansible.builtin.systemd_service:
        name: calibre-web
        state: restarted
        daemon_reload: true

