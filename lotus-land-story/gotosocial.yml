# https://docs.gotosocial.org/en/latest/getting_started/installation/container/

- name: Set up GoToSocial
  hosts: lotus-land-story
  vars_files:
    - vars.yml
  vars:
    version: 0.21.1
  tasks:

    - name: Create working directory
      ansible.builtin.file:
        path: /mnt/lotus-land-story/gotosocial
        state: directory
        mode: "0755"

    - name: Create data directory
      ansible.builtin.file:
        path: /mnt/lotus-land-story/gotosocial/data
        state: directory
        owner: 1000
        group: 1000
        mode: "0755"

    # TODO back this up using restic
    - name: Back up gotosocial if needed
      block:
        - name: Get current version
          ansible.builtin.command: >
            docker inspect
            --format '{{ '{{' }} index .Config.Labels "org.opencontainers.image.version"}}'
            gotosocial
          register: gotosocial_version
          changed_when: false

        - name: Stop and backup gotosocial
          when: gotosocial_version.stdout | trim != version
          block:
            - name: Stop gotosocial
              community.docker.docker_container:
                name: gotosocial
                state: stopped
            - name: Backup db
              ansible.builtin.copy:
                src: /mnt/lotus-land-story/gotosocial/data/sqlite.db
                dest: /mnt/lotus-land-story/gotosocial/sqlite.db.bak
                mode: "0400"
                remote_src: true

    - name: Get docker network for trusted proxies
      community.docker.docker_network:
        name: lotus_land_story
      register: docker_network

    # https://raw.githubusercontent.com/superseriousbusiness/gotosocial/main/example/docker-compose/docker-compose.yaml
    - name: Run GoToSocial
      community.docker.docker_container:
        name: gotosocial
        image: superseriousbusiness/gotosocial:{{ version }}
        restart: true
        restart_policy: unless-stopped
        env:
          GTS_HOST: hey.kejadlen.dev
          GTS_TRUSTED_PROXIES: "{{ docker_network.network.IPAM.Config[0].Subnet }}"
          GTS_LANDING_PAGE_USER: alpha
          GTS_DB_TYPE: sqlite
          GTS_DB_ADDRESS: /gotosocial/storage/sqlite.db
          GTS_OIDC_ENABLED: "true"
          GTS_OIDC_IDP_NAME: "Authelia"
          GTS_OIDC_ISSUER: https://auth.kejadlen.dev
          GTS_OIDC_CLIENT_ID: gotosocial
          GTS_OIDC_CLIENT_SECRET: "{{ gotosocial.oidc_client_secret }}"
          GTS_OIDC_ADMIN_GROUPS: admin
          GTS_METRICS_ENABLED: "true"
          OTEL_METRICS_PRODUCERS: prometheus
          OTEL_METRICS_EXPORTER: prometheus
          OTEL_EXPORTER_PROMETHEUS_HOST: gotosocial
          # GTS_ADVANCED_RATE_LIMIT_REQUESTS: "0"
          TZ: UTC
        volumes:
          - /mnt/lotus-land-story/gotosocial/data:/gotosocial/storage
        networks:
          - name: lotus_land_story

  handlers:
    - name: Import restarts
      ansible.builtin.import_tasks: restarts.yml

# vim: ft=yaml.ansible
