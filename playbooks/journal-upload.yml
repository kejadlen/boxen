# https://docs.victoriametrics.com/victorialogs/data-ingestion/journald/
- name: Ship journald to VictoriaLogs
  tags: journal-upload
  hosts: "{{ ansible_limit | default([]) }}"
  become: true
  tasks:

    - name: Assert distribution is Debian
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Debian"
        fail_msg: "This playbook only supports Debian distributions"

    - name: Install systemd-journal-remote
      ansible.builtin.apt:
        name: systemd-journal-remote
        state: present
        update_cache: true

    - name: Trust the Caddy root
      ansible.builtin.copy:
        src: ../modules/nixos/caddy-root.crt
        dest: /etc/systemd/caddy-root.crt
        mode: "0644"
      notify: Restart journal-upload

    # Without "-" for both Server keys, an https URL loads a client key and certificate from /etc/ssl.
    - name: Configure journal-upload
      ansible.builtin.lineinfile:
        path: /etc/systemd/journal-upload.conf
        regexp: "^#?{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: URL, value: "https://logs/insert/journald" }
        - { key: TrustedCertificateFile, value: /etc/systemd/caddy-root.crt }
        - { key: ServerKeyFile, value: "-" }
        - { key: ServerCertificateFile, value: "-" }
      loop_control:
        label: "{{ item.key }}"
      notify: Restart journal-upload

    - name: Enable and start journal-upload
      ansible.builtin.systemd:
        name: systemd-journal-upload
        enabled: true
        state: started

  handlers:
    - name: Restart journal-upload
      ansible.builtin.systemd:
        name: systemd-journal-upload
        state: restarted

